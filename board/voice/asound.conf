# edge-gesture-control：NXP AFE + VIT 語音辨識用的 ALSA 設定 (FRDM-i.MX93 + C270 麥克風)
# 改寫自 nxp-afe misc/asound.conf_imx93 (smart-kitchen 用的那份)：
#   * mic：EVK 有 4 顆板載麥克風，FRDM 沒有；AFE 的 VoiceSeekerLight 固定要 4 聲道，
#          所以把 C270 的單聲道複製成 4 聲道 (降噪 / 收音方向的效果會打折，但流程可以跑)
#   * spk：AFE 的參考訊號輸出 (回音消除用)。板子不需要播聲音，直接丟掉
#   * c270：C270 麥克風用 dsnoop 共用，AFE (喚醒詞) 和隊友的 audio_stream.py (聲音送 PC) 可以同時錄
#           audio_stream.py 請用 --device c270 (直接開 hw:1,0 會跟 AFE 搶裝置)
# run_voice.sh 會把它複製到 /etc/asound.conf (原本的備份在 /etc/asound.conf.gopoint-original)
defaults.pcm.rate_converter "linear"

pcm.spk
{
	type null
}

pcm.mic
{
	type plug
	slave.pcm "c270x4"
}

pcm.c270x4
{
	type route
	slave {
		pcm "c270"
		channels 1
	}
	ttable.0.0 1
	ttable.1.0 1
	ttable.2.0 1
	ttable.3.0 1
}

# C270 麥克風共用 (原生 16 kHz / mono / S16_LE，不用轉取樣率)
# period / buffer 要跟 AFE 開 mic 時要求的一樣 (800 / 32000 幀)，不然 afe 會 AudioStreamException 當掉
pcm.c270share
{
	type dsnoop
	ipc_key 1003
	ipc_perm 0666
	slave {
		pcm "hw:CARD=WEBCAM,DEV=0"
		format S16_LE
		rate 16000
		channels 1
		period_size 800
		buffer_size 32000
	}
}

pcm.c270
{
	type plug
	slave.pcm "c270share"
}

# 以下照 nxp-afe asound.conf_imx93：AFE 與 voice_ui_app 之間用 ALSA loopback 傳音訊
pcm.pwloop
{
	type hw
	card Loopback
	device 1
	subdevice 0
}

pcm.prloop
{
	type hw
	card Loopback
	device 0
	subdevice 0
}

pcm.cwloop
{
	type hw
	card Loopback
	device 1
	subdevice 1
}

pcm.crloop
{
	type hw
	card Loopback
	device 0
	subdevice 1
}

pcm.mix
{
	type dmix
	ipc_key 1001
	slave {
		pcm "pwloop"
		format S32_LE
		rate 48000
		channels 2
		buffer_size 512
		period_size 128
	}
}

pcm.split
{
	type dsnoop
	ipc_key 1002
	slave {
		pcm "crloop"
		format S32_LE
		rate 16000
		channels 1
		buffer_size 512
		period_size 128
	}
}

pcm.!default
{
	type asym
	playback.pcm "plug:mix"
	capture.pcm "plug:split"
}
